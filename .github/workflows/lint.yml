name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq ripgrep

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Install maintainer tooling dependencies
        run: python -m pip install "pypdf==6.18.1" "PyMuPDF==1.28.2" "Pillow==12.3.0" "PyYAML==6.0.3"

      - name: Run lint
        run: ./scripts/lint.sh
        env:
          CI: "true"

      - name: Run contract tests
        run: |
          for test_file in tests/test-*.sh; do
            echo "::group::$test_file"
            bash "$test_file"
            echo "::endgroup::"
          done

      - name: Document engineering tests
        run: |
          python3 tests/test-documents.py
          python3 tests/test-document-records.py
